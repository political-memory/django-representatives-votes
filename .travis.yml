sudo: false
language: python
env:
- DJANGO="django>1.8,<1.9" DJANGO_SETTINGS_MODULE=test.settings
python:
- "2.7"
install:
- pip install $DJANGO pep8 flake8 codecov
- pip install https://github.com/political-memory/django-representatives/archive/parltrack.tar.gz#egg=django-representatives
- pip install -e .
script:
- django-admin migrate
- flake8 representatives_votes/ --exclude migrations --ignore E128
- coverage run $(which django-admin) test
- cat test/data/dossiers_fixture.json | parltrack_import_dossiers
- cat test/data/votes_fixture.json | parltrack_import_votes
after_success:
- codecov
