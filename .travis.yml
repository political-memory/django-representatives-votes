sudo: false
language: python
env:
- DEBUG=True DJANGO_SETTINGS_MODULE=representatives_votes.tests.settings TEST=dossiers
- DEBUG=True DJANGO_SETTINGS_MODULE=representatives_votes.tests.settings TEST=votes
python:
- "2.7"
install:
- pip install django
- pip install -e git+https://github.com/political-memory/django-representatives.git@parltrack#egg=representatives
- pip install -e .
script:
- django-admin migrate
- django-admin parltrack_import_$TEST
